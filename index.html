<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b100d">
  <meta name="description" content="Malique Spooner — Computer Science student and product builder. Explore Night Economy and Agri Platform.">
  <title>Malique Spooner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b100d;--paper:#d9d8cb;--red:#a52d28;--muted:#9b9b92;--line:#d9d8cb30;--mono:'DM Mono',monospace;--sans:'DM Sans',Arial,sans-serif;--display:'Space Grotesk','DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:var(--bg);color:var(--paper);font-family:var(--sans);}
    ::selection{background:var(--red);color:#fff}
    .grain{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    .scene{position:fixed;inset:0;z-index:0;pointer-events:none}
    .scene canvas{display:block;width:100%;height:100%}
    .landing{position:relative;z-index:2;display:grid;place-items:center;width:100%;height:100svh;padding:32px 6vw 0}
    .name{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .fallback-name{display:none}
    .links{position:absolute;left:50%;bottom:clamp(48px,10vh,96px);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:14px;width:min(100%,560px)}
    .links a{min-height:54px;flex:0 1 240px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;border:1px solid var(--line);border-radius:999px;background:#d9d8cb06;color:var(--paper);text-decoration:none;font:500 14px var(--sans);letter-spacing:.01em;transition:background .25s ease,border-color .25s ease,color .25s ease,transform .25s ease}
    .links a span{color:var(--red);font:12px var(--mono);transition:transform .25s ease}
    .links a:hover,.links a:focus-visible{background:var(--paper);border-color:var(--paper);color:var(--bg);transform:translateY(-3px);outline:none}
    .links a:hover span,.links a:focus-visible span{color:var(--red);transform:translate(2px,-2px)}
    .links a:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--paper)}
    .no-webgl .fallback-name{display:block;position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);color:var(--paper);font:600 clamp(60px,15vw,190px)/.88 var(--display);letter-spacing:-.075em;white-space:nowrap}
    @media(max-width:640px){.landing{padding:20px 20px 0}.links{bottom:max(32px,env(safe-area-inset-bottom));width:calc(100% - 40px);gap:9px}.links a{min-width:0;min-height:48px;flex:1;padding:0 12px;gap:8px;font-size:13px;white-space:nowrap}.no-webgl .fallback-name{top:38%;font-size:clamp(64px,20vw,112px)}}
    @media(max-height:560px) and (min-width:641px){.links{bottom:26px}.links a{min-height:48px}}
    @media(prefers-reduced-motion:reduce){.links a,.links a span{transition:none}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="scene" aria-hidden="true"><canvas id="scene"></canvas></div>
  <main class="landing">
    <h1 class="name">Malique Spooner</h1>
    <p class="fallback-name" aria-hidden="true">Malique</p>
    <nav class="links" aria-label="Selected work">
      <a href="/night/tv/public-demo/">Night Economy <span aria-hidden="true">↗</span></a>
      <a href="/agri/">Agri Platform <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
  <script>
    (async()=>{
      const canvas=document.getElementById('scene');
      const gl=canvas.getContext('webgl',{alpha:true,antialias:true});
      if(!gl){document.body.classList.add('no-webgl');return}
      const vertex=`attribute vec3 p;attribute float seed;uniform vec2 resolution;uniform vec2 turn;uniform vec2 magnet;uniform float clock;varying float depth;void main(){float entrance=1.-exp(-clock*1.7);float edge=floor(seed*4.);float along=fract(seed*37.91)*2.-1.;vec2 spawn=edge<1.?vec2(-2.25,along*2.1):edge<2.?vec2(2.25,along*2.1):edge<3.?vec2(along*2.1,2.25):vec2(along*2.1,-2.25);vec3 q=p;q.xy=mix(spawn,p.xy,smoothstep(0.,.93,entrance));q.z=mix(.45,p.z,smoothstep(0.,.93,entrance))+p.x*.12;float cy=cos(turn.x),sy=sin(turn.x),cx=cos(turn.y),sx=sin(turn.y);q=vec3(cy*q.x+sy*q.z,q.y,-sy*q.x+cy*q.z);q=vec3(q.x,cx*q.y-sx*q.z,sx*q.y+cx*q.z);float perspective=3.8/(3.8+q.z);vec2 screen=q.xy*perspective;screen.x*=min(1.,resolution.x/900.);screen.y+=.20;vec2 away=screen-magnet;float field=exp(-dot(away,away)/.035);screen+=normalize(away+vec2(.00001))*field*.065;gl_Position=vec4(screen,0.,1.);gl_PointSize=clamp((1.7+seed*1.5)*perspective*min(resolution.y/620.,1.55),1.,4.2);depth=perspective;}`;
      const fragment=`precision mediump float;varying float depth;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;float a=(1.-smoothstep(.28,.5,d));vec3 warm=mix(vec3(.85,.82,.72),vec3(.65,.20,.16),smoothstep(1.05,1.55,depth));gl_FragColor=vec4(warm,a);}`;
      const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);return gl.getShaderParameter(shader,gl.COMPILE_STATUS)?shader:null};
      const vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,fragment);
      if(!vs||!fs){document.body.classList.add('no-webgl');return}
      const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
      if(!gl.getProgramParameter(program,gl.LINK_STATUS)){document.body.classList.add('no-webgl');return}
      gl.useProgram(program);
      const position=gl.getAttribLocation(program,'p'),seedLoc=gl.getAttribLocation(program,'seed');
      const res=gl.getUniformLocation(program,'resolution'),turn=gl.getUniformLocation(program,'turn'),magnet=gl.getUniformLocation(program,'magnet'),clock=gl.getUniformLocation(program,'clock');
      const source=document.createElement('canvas'),ctx=source.getContext('2d',{willReadFrequently:true});source.width=1800;source.height=700;
      await document.fonts.load('600 320px "Space Grotesk"').catch(()=>[]);
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='600 320px "Space Grotesk", sans-serif';ctx.letterSpacing='-10px';ctx.fillText('MALIQUE',900,350);
      const data=ctx.getImageData(0,0,source.width,source.height).data,points=[],seeds=[];
      for(let y=0;y<source.height;y+=5)for(let x=0;x<source.width;x+=5){if(data[(y*source.width+x)*4+3]>100){const nx=(x/source.width-.5)*2.18,ny=(.5-y/source.height)*1.3,random=Math.sin(x*12.9898+y*78.233)*43758.5453,seed=random-Math.floor(random);points.push(nx,ny,(seed-.5)*.18);seeds.push(seed)}}
      const pbuf=gl.createBuffer(),sbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(points),gl.STATIC_DRAW);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,sbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(seeds),gl.STATIC_DRAW);gl.enableVertexAttribArray(seedLoc);gl.vertexAttribPointer(seedLoc,1,gl.FLOAT,false,0,0);
      gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.clearColor(0,0,0,0);
      let pointer=[0,0],target=[0,0],cursor=[3,3],targetCursor=[3,3],active=true;
      const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.addEventListener('visibilitychange',()=>active=!document.hidden);
      addEventListener('pointermove',e=>{target=[(e.clientX/innerWidth-.5)*.72,(e.clientY/innerHeight-.5)*-.48];targetCursor=[(e.clientX/innerWidth-.5)*2,(.5-e.clientY/innerHeight)*2]},{passive:true});
      document.addEventListener('pointerleave',()=>{target=[0,0];targetCursor=[3,3]});
      function render(ms){if(!active){requestAnimationFrame(render);return}const ratio=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.floor(canvas.clientWidth*ratio)),h=Math.max(1,Math.floor(canvas.clientHeight*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}pointer[0]+=(target[0]-pointer[0])*.065;pointer[1]+=(target[1]-pointer[1])*.065;cursor[0]+=(targetCursor[0]-cursor[0])*.075;cursor[1]+=(targetCursor[1]-cursor[1])*.075;gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform2f(res,w,h);gl.uniform2f(turn,reduced?0:pointer[0],reduced?0:pointer[1]);gl.uniform2f(magnet,reduced?3:cursor[0],reduced?3:cursor[1]);gl.uniform1f(clock,reduced?10:ms*.001);gl.drawArrays(gl.POINTS,0,seeds.length);requestAnimationFrame(render)}
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
